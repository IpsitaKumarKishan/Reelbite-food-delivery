# ─── Reelbite Food Delivery – Docker Compose ─────────────────────────────────

# Services: backend (Express/Socket.IO), frontend (React/Nginx), redis
# Database: MongoDB Atlas (Cloud Managed Database)

services:

  # ── Redis (Event Queue Broker for BullMQ) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reelbite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reelbite-net

  # ── Backend (Node.js / Express / Socket.IO) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reelbite-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Connects directly to MongoDB Atlas Cloud Database
      MONGODB_URL: ${MONGODB_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 5000
    depends_on:
      - redis
    volumes:
      # Persist uploaded files across container restarts
      - uploads:/app/public/uploads
    networks:
      - reelbite-net
    ports:
      - "5000:5000"

  # ── Frontend (React/Vite built, served by Nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_APIKEY: ${VITE_FIREBASE_APIKEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_GEOAPIKEY: ${VITE_GEOAPIKEY}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: reelbite-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - reelbite-net
    ports:
      - "${FRONTEND_PORT:-80}:80"

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  uploads:
  redis_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  reelbite-net:
    driver: bridge
