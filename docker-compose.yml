
# ─── Reelbite Food Delivery – Docker Compose ─────────────────────────────────

# Services: backend (Express/Socket.IO), frontend (React/Nginx), mongodb

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: reelbite-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: reelbite
    volumes:
      - mongo_data:/data/db
    networks:
      - reelbite-net
    # Expose only on the internal network (not to host) for security
    # Remove/change the ports mapping below if you need external access
    # ports:
    #   - "27017:27017"

  # ── Backend (Node.js / Express / Socket.IO) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reelbite-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override MONGODB_URL to point to the containerised MongoDB service
      # (must match the key read in config/db.js: process.env.MONGODB_URL)
      MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongodb:27017/reelbite?authSource=admin
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      # Persist uploaded files across container restarts
      - uploads:/app/public/uploads
    networks:
      - reelbite-net
    # Expose backend port to host (optional, useful for debugging)
    ports:
      - "5000:5000"

  # ── Frontend (React/Vite built, served by Nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_APIKEY: ${VITE_FIREBASE_APIKEY:-AIzaSyAOo7_Q7ou8yZmpWKbiSEykKo1uoKy-rn4}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-reelbite-food-delivery.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-reelbite-food-delivery}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-reelbite-food-delivery.firebasestorage.app}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-533665669672}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:533665669672:web:9ee8ae29c778b6bec44b1d}
        VITE_GEOAPIKEY: ${VITE_GEOAPIKEY:-d3c84e135bd24b69bd0408b13b36a120}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-rzp_test_TI3I0di14Tgla3}
    container_name: reelbite-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - reelbite-net
    ports:
      - "80:80"

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  uploads:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  reelbite-net:
    driver: bridge
